# Generated by an LLM from a Design-tab prompt, imported on 2026-10-09.
id: testondemand
title: "testOnDemand"
description: >-
  Twenty mid-level (L3) questions across data science, data engineering, software engineering
  and the modern Python stack. They cover realistic scenarios such as evaluation on imbalanced
  data, SQL pitfalls, dimensional modeling, streaming, table layout, testing, concurrency and pandas joins.
author: "claude-opus-5-5 2026-10-09"
questions:
  - id: ds-ml-eval-003
    domain: ds
    topic: ml-eval
    tags: [roc-auc, pr-auc, fraud-detection, imbalanced-data]
    level: 3
    kind: concept
    type: single
    prompt: |
      A fraud model scores card transactions; 0.2% of them are fraudulent. Analysts can only
      review the few hundred highest-scored transactions per day. Two candidate models:

      | model | ROC AUC | PR AUC (average precision) |
      |---|---|---|
      | A | 0.97 | 0.31 |
      | B | 0.95 | 0.52 |

      Which reading of these numbers is the most accurate for this use case?
    choices:
      - id: a
        text: "Model A: ROC AUC is the standard summary and, unlike PR AUC, doesn't depend on class balance"
        why: "ROC AUC is indeed insensitive to prevalence, and that is the problem here. A tiny false positive rate over millions of legitimate transactions still floods the review queue, and ROC AUC barely registers it."
      - id: b
        text: "Model B: PR AUC tracks precision in the top-ranked alerts, which is what analysts see"
        why: "Correct. Precision-recall curves measure how pure the top of the ranking is, and that is exactly what a capacity-limited review team experiences."
      - id: c
        text: "They're equivalent: PR AUC is ROC AUC rescaled for imbalanced data"
        why: "The two curves use different axes (precision against recall, versus TPR against FPR). Their areas can rank models differently when the curves cross."
      - id: d
        text: "Neither: at 0.2% prevalence both AUCs are inflated and only accuracy is reliable"
        why: "Accuracy is the worst choice here: predicting 'never fraud' scores 99.8% accuracy while catching nothing."
    answer: [b]
    explanation: |
      ROC AUC averages performance over all false positive rates, and it does not change with class
      prevalence. When negatives vastly outnumber positives, a small FPR still produces many false
      alerts, so ROC AUC can look excellent while precision at the top of the ranking is poor.
      Average precision (PR AUC) has a baseline equal to the prevalence (0.002 here), so it reacts
      directly to how many top alerts are real. Saito & Rehmsmeier (2015) discuss this in "The
      precision-recall plot is more informative than the ROC plot when evaluating binary classifiers
      on imbalanced datasets". In scikit-learn, compare `average_precision_score` with `roc_auc_score`.

  - id: ds-stats-003
    domain: ds
    topic: stats
    tags: [ab-testing, experimentation, significance]
    level: 3
    kind: concept
    type: single
    prompt: |
      An A/B test was planned as a fixed-horizon two-sided t-test at α = 0.05 over 4 weeks.
      The product manager instead checks the dashboard every day and stops the test on the
      first day the p-value drops below 0.05. Assuming the variant truly has **no** effect,
      what does this procedure do?
    choices:
      - id: a
        text: "The false positive rate climbs well above 5%: each look is another chance to cross"
        why: "Correct. Under the null, the p-value wanders over time. With ~28 looks, the chance that it dips below 0.05 at least once is far higher than 5%."
      - id: b
        text: "Nothing changes: the 5% level holds at each look, so stopping at the first p < 0.05 is fine"
        why: "Each single look has a 5% error rate, but the procedure as a whole has a much larger one. Stopping on the first success is exactly what inflates it."
      - id: c
        text: "The test turns conservative: stopping early costs power, so real effects are missed more often"
        why: "This reverses the effect. Optional stopping makes false positives more likely, not less."
      - id: d
        text: "Only the effect estimate is biased; the p-value at the stopping point remains valid"
        why: "Estimates from early-stopped tests are indeed inflated (a winner's curse), but the p-value is not valid either. Its guarantee assumed a single look at a fixed sample size."
    answer: [a]
    explanation: |
      A fixed-horizon test controls the false positive rate only if you analyse once, at the
      planned sample size. "Peeking" and stopping at the first significant result can push the
      real error rate to 20-30% or more, depending on how often you look. If you need to monitor
      a test continuously, use a sequential design such as group-sequential tests with alpha
      spending (O'Brien-Fleming) or always-valid inference (mSPRT). Many experimentation platforms
      offer these methods.

  - id: ds-ml-preprocessing-001
    domain: ds
    topic: ml-preprocessing
    tags: [feature-scaling, standardization, scikit-learn]
    level: 3
    kind: concept
    type: multi
    prompt: |
      A dataset has two numeric features: `annual_income` (from 10,000 to 1,000,000) and
      `age` (from 18 to 90). You fit each model below with and without `StandardScaler`, keeping
      all other hyperparameters at their defaults. For which models would standardizing
      **materially change** the fitted model's predictions? **Select all that apply.**
    choices:
      - id: a
        text: "k-nearest neighbours with Euclidean distance"
        why: "Correct. Without scaling, distances are driven almost entirely by income, so age is effectively ignored."
      - id: b
        text: "Logistic regression with the default L2 penalty"
        why: "Correct. The penalty acts on coefficient sizes, which depend on feature scale, so unscaled features are regularized unevenly."
      - id: c
        text: "Random forest"
        why: "Tree splits are thresholds on a single feature. Standardizing preserves the order of values, so the same partitions are found."
      - id: d
        text: "SVM with an RBF kernel"
        why: "Correct. The RBF kernel depends on Euclidean distances between points, so the large-range feature dominates the kernel."
      - id: e
        text: "Gradient-boosted trees such as LightGBM"
        why: "Histogram binning and threshold splits depend only on the order of values. Standardization does not change that order."
    answer: [a, b, d]
    explanation: |
      Models built on distances (k-NN, RBF kernels, k-means) or on penalties applied to
      coefficient magnitudes (ridge, lasso, L2-penalized logistic regression) are sensitive to
      feature scale. Tree-based models split on per-feature thresholds, so they are invariant to
      monotonic transformations like standardization. In scikit-learn, put the scaler in a
      `Pipeline` so it is fitted only on the training folds.

  - id: ds-ml-fundamentals-002
    domain: ds
    topic: ml-fundamentals
    tags: [learning-curves, bias-variance, model-selection]
    level: 3
    kind: concept
    type: single
    prompt: |
      You plot learning curves for a gradient-boosted model with shallow trees (`max_depth=2`):

      | training rows | training accuracy | validation accuracy |
      |---|---|---|
      | 1,000 | 0.72 | 0.69 |
      | 10,000 | 0.71 | 0.70 |
      | 50,000 | 0.71 | 0.70 |

      The business needs about 0.85. Which next step is most likely to help?
    choices:
      - id: a
        text: "Collect more labelled data, since validation accuracy is still improving"
        why: "Both curves are flat from 10k to 50k rows. More data of the same kind will not raise a plateau that low."
      - id: b
        text: "Use a more flexible model or engineer more informative features, since both curves plateau low"
        why: "Correct. Training and validation scores are close together and both low: the model underfits. Adding capacity or better features addresses that bias."
      - id: c
        text: "Add stronger regularization to close the gap between train and validation"
        why: "There is almost no gap to close. More regularization reduces capacity further and would make the underfitting worse."
      - id: d
        text: "Use more cross-validation folds to get a more reliable estimate"
        why: "More folds make the estimate a bit less noisy, but they don't change the model's actual performance."
    answer: [b]
    explanation: |
      Learning curves separate bias from variance. A large train-validation gap that shrinks as
      data grows points to high variance, which more data or regularization can fix. Two curves
      that converge at a low score point to high bias: the model is too simple or the features
      carry too little signal. Here, deeper trees, more boosting rounds or better features are the
      levers to try. scikit-learn's `LearningCurveDisplay` draws these plots.

  - id: ds-ml-validation-003
    domain: ds
    topic: ml-validation
    tags: [cross-validation, scikit-learn, generalization]
    level: 3
    kind: concept
    type: single
    prompt: |
      A clinical dataset has 20,000 rows: about 10 visits for each of 2,000 patients. Features
      include lab values that stay fairly stable for a given patient. Random 5-fold
      cross-validation gives ROC AUC 0.91, but on patients the model has never seen, production AUC is 0.74.
      What is the most likely cause, and the fix?
    choices:
      - id: a
        text: "Visits from one patient appear in train and validation folds; split by patient with `GroupKFold`"
        why: "Correct. The model partly recognizes individual patients rather than learning patterns that generalize. Grouped splits keep each patient entirely on one side."
      - id: b
        text: "The folds aren't stratified, so class ratios drift; use `StratifiedKFold` to keep them equal in every fold"
        why: "With 20k rows, random folds already have similar class ratios. Stratifying would not explain a drop from 0.91 to 0.74."
      - id: c
        text: "Five folds are too few for 20k rows; 10-fold CV would give a lower, more realistic estimate"
        why: "The number of folds changes the variance of the estimate a little, not this systematic optimism. The leakage between folds would remain."
      - id: d
        text: "The rows weren't shuffled before splitting; set `shuffle=True` in `KFold` to fix the gap"
        why: "Shuffling spreads each patient's visits across folds even more evenly, so it would keep or worsen the leakage."
    answer: [a]
    explanation: |
      When rows are not independent (several visits per patient, sessions per user, images per
      device), a random split puts near-duplicate information on both sides of the split. The
      validation score then measures memorization of individuals. The validation strategy should
      mirror how the model will be used: on new patients, so split by patient. scikit-learn
      provides `GroupKFold`, plus `StratifiedGroupKFold` (since 1.0) if you also need balanced classes.

  - id: de-sql-004
    domain: de
    topic: sql
    tags: [subqueries, anti-join]
    level: 3
    kind: practical
    type: single
    prompt: |
      `customers` has 1,000 rows, and 200 of these customers have never ordered.
      `orders.customer_id` is nullable: guest checkouts store `NULL`, and a few such orders exist.

      ~~~sql
      SELECT c.customer_id
      FROM customers c
      WHERE c.customer_id NOT IN (SELECT o.customer_id FROM orders o);
      ~~~

      What does this query return in PostgreSQL?
    choices:
      - id: a
        text: "The 200 customers who never placed an order"
        why: "That would be true if the subquery contained no NULL. A single NULL changes the result of every comparison."
      - id: b
        text: "No rows: each `NOT IN` test evaluates to unknown, never true"
        why: "Correct. `x NOT IN (..., NULL)` expands to `... AND x <> NULL`, which is UNKNOWN for every customer, so `WHERE` keeps nothing."
      - id: c
        text: "The 200 customers, since NULLs in the list are skipped, as in `COUNT(col)`"
        why: "Aggregates such as `COUNT(col)` skip NULLs, but `NOT IN` doesn't. It compares against every value in the list, including NULL."
      - id: d
        text: "An error: a `NOT IN` subquery may not return NULL values"
        why: "The query is valid SQL and runs. It just returns a surprising, silent result."
    answer: [b]
    explanation: |
      SQL uses three-valued logic: comparing anything with NULL yields UNKNOWN, and `WHERE` keeps
      only TRUE rows. `NOT IN` is a chain of `<>` comparisons joined by `AND`, so one NULL in the
      list makes it UNKNOWN for every outer row. Write anti-joins with
      `NOT EXISTS (SELECT 1 FROM orders o WHERE o.customer_id = c.customer_id)`, which is
      NULL-safe, or filter `WHERE o.customer_id IS NOT NULL` in the subquery.

  - id: de-sql-005
    domain: de
    topic: sql
    tags: [aggregation, avg, reporting]
    level: 3
    kind: concept
    type: single
    prompt: |
      In `order_lines`, `discount_pct` is `NULL` when no discount was applied. A day has four
      lines with `discount_pct` values `10, 20, NULL, NULL`. The dashboard runs
      `SELECT AVG(discount_pct) FROM order_lines` and shows **15**. Finance says the average
      discount per line is **7.5**. Which expression gives Finance's number in PostgreSQL?
    choices:
      - id: a
        text: "`AVG(COALESCE(discount_pct, 0))`"
        why: "Correct. NULL here means 'no discount', so it is replaced with 0 and all four lines are averaged: 30 / 4 = 7.5."
      - id: b
        text: "`SUM(discount_pct) / COUNT(discount_pct)`"
        why: "`COUNT(col)` also skips NULLs, so this is 30 / 2 = 15, the same as `AVG`."
      - id: c
        text: "`AVG(discount_pct) FILTER (WHERE discount_pct IS NOT NULL)`"
        why: "This filter only states explicitly what `AVG` already does. It still averages the two non-NULL lines: 15."
      - id: d
        text: "`AVG(DISTINCT discount_pct)`"
        why: "This averages the distinct non-NULL values, 10 and 20, which still gives 15."
    answer: [a]
    explanation: |
      Aggregate functions other than `COUNT(*)` ignore NULLs. So `AVG(col)` is
      `SUM(col) / COUNT(col)` over non-NULL rows only. That is right when NULL means "unknown"
      and wrong when NULL encodes a real value such as zero. Decide what NULL means in each
      column, and either store the real value (0) at load time or `COALESCE` it in the metric
      definition.

  - id: de-data-modeling-002
    domain: de
    topic: data-modeling
    tags: [dimensional-modeling, customer-dimension, history]
    level: 3
    kind: design
    type: single
    prompt: |
      Customers sometimes move between sales regions. Today `dim_customer` is simply overwritten
      when a customer moves. Two requirements arrive:

      - Finance: revenue by the customer's region **as it was at the time of each sale**.
      - Marketing: all historical revenue by each customer's **current** region.

      Which dimension design supports both in a standard star schema?
    choices:
      - id: a
        text: "SCD Type 2 with surrogate keys: each fact references the version valid at sale time"
        why: "Correct. Facts point to the historical version, which serves Finance. Joining through the natural key to the row flagged current serves Marketing."
      - id: b
        text: "Keep Type 1 and copy the whole dimension into an archive schema every month"
        why: "Monthly snapshots lose changes within a month. Matching each sale to the right snapshot also becomes an awkward date join."
      - id: c
        text: "Add a `previous_region` column (Type 3) holding the region before the last move"
        why: "Type 3 keeps only one prior value, and doesn't record which region applied when. Customers who moved twice break it."
      - id: d
        text: "SCD Type 2, but join facts on the natural `customer_id` to the latest version of each customer"
        why: "This gives only the current region and throws away the history that Type 2 stores. Finance's requirement is not met."
    answer: [a]
    explanation: |
      A slowly changing dimension of Type 2 adds a new row, with a new surrogate key, each time a
      tracked attribute changes. It records validity dates (`valid_from`, `valid_to`) and often an
      `is_current` flag. The fact table stores the surrogate key that was valid at load time, so
      history is preserved without any date logic in queries. Current-state reporting joins through
      the natural key to the current row. Some teams also add current attributes to every version
      (a "Type 6" hybrid). See Kimball & Ross, *The Data Warehouse Toolkit*, and dbt snapshots for an implementation.

  - id: de-data-modeling-003
    domain: de
    topic: data-modeling
    tags: [fact-table, aggregation, measures]
    level: 3
    kind: concept
    type: single
    prompt: |
      `fct_order_lines` has one row per order line. To simplify reporting, an engineer added a
      `shipping_cost` column holding the order's shipping charge, which is billed **once per
      order**, on every line of that order. Order 42 has 3 lines and a 9.00 shipping charge.

      What will `SUM(shipping_cost)` grouped by month report for order 42's contribution?
    choices:
      - id: a
        text: "Count order 42's shipping three times, 27.00 instead of 9.00"
        why: "Correct. The order-level amount is repeated on each of the 3 lines, so summing at line level triples it."
      - id: b
        text: "Be correct, since SUM respects the fact table's grain"
        why: "SQL knows nothing about grain. SUM adds every row it is given."
      - id: c
        text: "Be correct if the query also groups by `order_id`"
        why: "Grouping by order still sums the 3 repeated values within the order, giving 27.00."
      - id: d
        text: "Be correct if the column is flagged non-additive"
        why: "Warehouses don't enforce such flags in plain SQL. Metadata in a BI tool cannot fix data stored at the wrong grain."
    answer: [a]
    explanation: |
      Every fact table should have one declared grain, and every measure in it must be true at
      that grain. Putting an order-level amount on line-level rows mixes grains, so additive
      aggregation double-counts it. Either allocate the amount across lines (by value or weight)
      so the line values sum to the order total, or keep a separate `fct_orders` table at order
      grain for header-level measures.

  - id: de-file-formats-002
    domain: de
    topic: file-formats
    tags: [parquet, spark, s3, object-storage]
    level: 3
    kind: internals
    type: single
    prompt: |
      A Spark Structured Streaming job writes Parquet files to S3 every minute into date
      partitions. One day of data is about 650 MB spread over roughly 13,000 files of 50 KB
      each. A batch query that reads a single day is slow, and most of its time passes before
      any rows are actually processed. What is the main cause?
    choices:
      - id: a
        text: "Per-file overhead: each file costs a listing entry, an open request and a footer read"
        why: "Correct. With thousands of tiny files, the fixed cost of listing, requesting and parsing metadata for each file dominates the cost of reading the data."
      - id: b
        text: "Parquet barely compresses files under 1 MB, so the day is really ~20 GB on disk"
        why: "Small files do compress less well, but nowhere near 30x worse. The reported 650 MB is the size on storage anyway."
      - id: c
        text: "S3 allows only one GET per second per prefix, so the reads are throttled"
        why: "S3 supports thousands of GET requests per second per prefix (about 5,500). Throttling isn't the bottleneck at this scale."
      - id: d
        text: "Spark always merges the schemas of every file on read, a step that grows quadratically with file count"
        why: "Schema merging is off by default (`mergeSchema=false`). Spark reads one footer to infer the schema unless asked to merge."
    answer: [a]
    explanation: |
      Columnar formats are efficient when files are large enough for this per-file overhead to be
      amortized. Each file adds an object-store request, a footer (metadata) read and planning
      work; Spark even models this as `spark.sql.files.openCostInBytes`. The usual remedy is
      compaction into files of roughly 128 MB to 1 GB. Use a periodic rewrite job, or the table
      format's tools: Delta `OPTIMIZE`, Iceberg `rewrite_data_files`. Writing with fewer, larger
      micro-batches also helps.

  - id: de-streaming-002
    domain: de
    topic: streaming
    tags: [kafka, windowing, aggregation]
    level: 3
    kind: concept
    type: single
    prompt: |
      A stream processor counts orders per hour from a Kafka topic and feeds a dashboard. The
      processor crashed at 10:00 and was restarted at 12:00. It then read the two-hour backlog
      in a few minutes. The dashboard shows almost no orders for 10:00-12:00 and a huge spike in
      the 12:00 bucket. What change fixes the chart for future incidents?
    choices:
      - id: a
        text: "Assign records to windows by event time (when the order happened), not arrival time"
        why: "Correct. Windowing on the timestamp carried in the record places backlog records in the hours when the orders actually happened."
      - id: b
        text: "Add partitions so that the backlog is consumed faster after a restart"
        why: "Faster catch-up still puts every record into the window of the moment it is processed, so the spike remains."
      - id: c
        text: "Enable exactly-once processing so that replayed records aren't double-counted at 12:00"
        why: "The problem is not duplicates but which window records fall into. Exactly-once semantics doesn't change that."
      - id: d
        text: "Commit consumer offsets more often so that fewer records pile up and replay at restart"
        why: "Offset commit frequency affects how much is reprocessed after a crash. It does nothing for the two hours the consumer was down."
    answer: [a]
    explanation: |
      Processing time is when the system sees a record; event time is when the event happened.
      Aggregating by processing time ties results to the pipeline's own outages, lag and replays.
      Aggregating by event time gives correct, reproducible results. Event-time processing then
      needs a policy for late data, usually a watermark that bounds how long windows wait.
      Flink, Spark Structured Streaming and Kafka Streams all support event-time windows. See also
      Akidau et al., "The Dataflow Model" (VLDB 2015).

  - id: de-streaming-003
    domain: de
    topic: streaming
    tags: [kafka, partitions, consumer-groups, ordering]
    level: 3
    kind: internals
    type: multi
    prompt: |
      The Kafka topic `orders` has 6 partitions. Producers use the default partitioner with
      `customer_id` as the message key. A single consumer group with 8 consumer instances reads
      the topic, using classic consumer-group semantics. Which statements are true?
      **Select all that apply.**
    choices:
      - id: a
        text: "Two of the 8 consumers are assigned no partitions"
        why: "Correct. Within a consumer group, each partition goes to at most one consumer, so 6 partitions keep at most 6 consumers busy."
      - id: b
        text: "A given customer's orders land in one partition, so the group reads them in write order"
        why: "Correct. The key hash picks the partition, and Kafka preserves order within a partition."
      - id: c
        text: "Because keys are set, Kafka orders all messages across the whole topic"
        why: "Kafka guarantees order only within a partition. Messages for different keys in different partitions have no global order."
      - id: d
        text: "Raising the topic to 12 partitions can route a customer's new orders to a different partition"
        why: "Correct. The default mapping is hash(key) modulo the number of partitions, so changing the partition count remaps keys and breaks per-key ordering across the change."
      - id: e
        text: "Each order is delivered to all 8 consumers, which then deduplicate it"
        why: "Inside one group, each message goes to a single consumer. Broadcasting happens only across different consumer groups."
    answer: [a, b, d]
    explanation: |
      A topic's partition count caps the parallelism of a consumer group, and extra consumers
      stay idle as standbys. Keyed messages give per-key ordering because every message with the
      same key hashes to the same partition, but only as long as the partition count doesn't
      change. Plan partition counts ahead for keyed topics. Kafka 4.x share groups (KIP-932) are
      a separate queue-like model in which several consumers can read one partition. Classic
      consumer groups behave as described here.

  - id: de-pipelines-002
    domain: de
    topic: pipelines
    tags: [batch, data-quality, dashboards]
    level: 3
    kind: design
    type: single
    prompt: |
      A nightly job rebuilds `analytics.daily_revenue` in place: it truncates the table, then
      inserts rows in batches over about 20 minutes. Two incidents happened:

      1. Dashboards refreshed during the run showed partial totals.
      2. A corrupt upstream file once published negative revenue that executives saw before anyone noticed.

      Which change addresses **both** incidents?
    choices:
      - id: a
        text: "Write to a staging table, run quality checks, then publish it atomically if they pass"
        why: "Correct. Readers see either the old complete table or the new validated one, and failed checks block publication."
      - id: b
        text: "Move the run to 3 a.m., when hardly anyone has the dashboards open"
        why: "This makes the partial window less visible but doesn't remove it, and it does nothing against bad data."
      - id: c
        text: "Retry each insert batch with exponential backoff until it succeeds"
        why: "The batches weren't failing. Retries change neither what readers see mid-run nor whether the data is valid."
      - id: d
        text: "Have dashboards read with `READ UNCOMMITTED` to see fresh rows"
        why: "Reading uncommitted data exposes even more partial state, and PostgreSQL treats it as `READ COMMITTED` anyway."
    answer: [a]
    explanation: |
      This is the write-audit-publish (WAP) pattern: build the new version out of sight, test it,
      then expose it with one atomic step. That step can be a table swap (Snowflake
      `ALTER TABLE ... SWAP WITH`), a view repoint, a partition exchange, or a branch fast-forward
      in Iceberg or Nessie. dbt's `build` runs tests before dependent models, and data-quality
      tools such as Great Expectations or Soda can gate the publish step.

  - id: de-warehousing-002
    domain: de
    topic: warehousing
    tags: [bigquery, table-layout, cost]
    level: 3
    kind: design
    type: single
    prompt: |
      A BigQuery table `events` receives about 300 GB per day and has columns `event_ts`,
      `event_date`, `user_id` (tens of millions of distinct values) and a JSON payload. Access patterns:

      - Dashboards aggregate all users over the last 7 days.
      - Support looks up one user's events over the last 30 days.
      - Data older than 13 months must be deleted automatically.

      Which table layout fits best?
    choices:
      - id: a
        text: "Partition by `event_date` with expiration, cluster by `user_id`"
        why: "Correct. Date partitions prune both query patterns and expire old data automatically, while clustering prunes blocks for single-user lookups."
      - id: b
        text: "Integer-range partition on `user_id`, and cluster by `event_date`"
        why: "BigQuery caps the number of partitions per table, so tens of millions of users would have to share wide ranges. Date-range dashboards would scan everything, and retention gets harder."
      - id: c
        text: "Date-sharded tables (`events_YYYYMMDD`), each clustered by `user_id`"
        why: "Google recommends partitioned tables over date sharding. Each shard carries its own schema and metadata overhead, and wildcard queries add complexity."
      - id: d
        text: "No partitioning; cluster by `user_id, event_date` so both filters prune blocks"
        why: "Clustering by `user_id` first does little for date-only dashboard queries, and there is no partition expiration or reliable up-front cost estimate."
    answer: [a]
    explanation: |
      In BigQuery, partitioning is coarse pruning on one column, usually a date: queries filtered
      on it scan only matching partitions, costs are known before running, and settings such as
      `partition_expiration_days` handle retention. Clustering sorts data within partitions by up
      to four columns, which suits high-cardinality filters like `user_id`. The rule of thumb is
      to partition on the time column used for filtering and lifecycle, and cluster on the
      selective lookup keys.

  - id: de-incremental-loads-001
    domain: de
    topic: incremental-loads
    tags: [merge, upsert, staging]
    level: 3
    kind: practical
    type: single
    prompt: |
      A daily job upserts products from a staging table (PostgreSQL 15+ or BigQuery):

      ~~~sql
      MERGE INTO dim_product t
      USING staging_products s
        ON t.product_id = s.product_id
      WHEN MATCHED THEN
        UPDATE SET price = s.price, updated_at = s.updated_at
      WHEN NOT MATCHED THEN
        INSERT (product_id, price, updated_at)
        VALUES (s.product_id, s.price, s.updated_at);
      ~~~

      Product 17 already exists in `dim_product`. Today `staging_products` contains **two** rows
      for product 17, because its price changed twice during the day. What happens?
    choices:
      - id: a
        text: "It fails: a target row matches two source rows; dedupe staging to one row per key"
        why: "Correct. Both engines reject a MERGE that would update the same target row twice. Keep the latest row per key first, e.g. with `ROW_NUMBER()` or `QUALIFY`."
      - id: b
        text: "The staging row with the latest `updated_at` wins, as MERGE applies rows in time order"
        why: "MERGE has no notion of time order. Source rows form an unordered set."
      - id: c
        text: "Both rows get inserted, leaving two versions of product 17 in `dim_product`"
        why: "The rows match an existing target row, so the `NOT MATCHED` branch doesn't run. Duplicate inserts happen only for keys that are new to the target."
      - id: d
        text: "One of the two rows wins arbitrarily: the result is non-deterministic but raises no error"
        why: "That's what some engines do when configured to allow it (e.g. Snowflake with `ERROR_ON_NONDETERMINISTIC_MERGE = FALSE`). PostgreSQL and BigQuery raise an error."
    answer: [a]
    explanation: |
      The SQL standard requires each target row to be modified at most once per MERGE, because
      otherwise the outcome would depend on processing order. PostgreSQL raises "MERGE command
      cannot affect row a second time", BigQuery requires each target row to match at most one
      source row, and Snowflake errors by default. Incremental loads should therefore deduplicate
      the source to one row per key before merging. Note that brand-new keys would hit the
      `NOT MATCHED` branch twice and be inserted twice, silently.

  - id: swe-testing-002
    domain: swe
    topic: testing
    tags: [mocking, unittest-mock, python]
    level: 3
    kind: practical
    type: single
    prompt: |
      ~~~python
      # app/report.py
      from app.clock import now

      def header():
          return f"Report generated at {now():%Y-%m-%d}"
      ~~~

      ~~~python
      # tests/test_report.py
      from datetime import datetime
      from unittest.mock import patch
      from app import report

      def test_header():
          with patch("app.clock.now", return_value=datetime(2026, 1, 1)):
              assert report.header() == "Report generated at 2026-01-01"
      ~~~

      The assertion fails: the header contains today's date. Which change makes the test pass?
    choices:
      - id: a
        text: "Patch `app.report.now`, the name `header()` actually looks up"
        why: "Correct. `from app.clock import now` copied a reference into `app.report`'s namespace, so that is the name to replace."
      - id: b
        text: "Add `autospec=True` so the mock matches the signature of `now`"
        why: "Autospec checks call signatures but doesn't change which name is replaced. `report.now` still points to the real function."
      - id: c
        text: "Pass `new=lambda: datetime(2026, 1, 1)` instead of `return_value`"
        why: "The replacement object isn't the problem. It is still installed on `app.clock`, which `header()` never consults."
      - id: d
        text: "Apply `patch` as a decorator on the test instead of a context manager"
        why: "Decorator and context-manager forms patch exactly the same target. Only the scope syntax differs."
    answer: [a]
    explanation: |
      `unittest.mock.patch` replaces a name in a namespace, so you must patch where the object is
      looked up, not where it was defined. After `from app.clock import now`, the module
      `app.report` holds its own reference named `now`. Patching `app.clock.now` leaves that
      reference untouched. The Python docs cover this in the "Where to patch" section of
      `unittest.mock`. Injecting a clock as a parameter avoids the issue altogether.

  - id: swe-api-design-002
    domain: swe
    topic: api-design
    tags: [rest, list-endpoints, performance]
    level: 3
    kind: design
    type: single
    prompt: |
      An API lists events newest first:

      ~~~http
      GET /events?offset=200&limit=100
      ~~~

      It is backed by `ORDER BY created_at DESC LIMIT 100 OFFSET 200`. New events arrive several
      times per second. Clients paging through results report duplicated events across pages,
      and requests with offsets in the hundreds of thousands take seconds. Which change fixes both problems?
    choices:
      - id: a
        text: "Cursor pagination on `(created_at, id)`: return the last key seen, filter on it next"
        why: "Correct. `WHERE (created_at, id) < (:ts, :id)` with an index is stable under inserts and costs the same at any depth."
      - id: b
        text: "Keep offsets but cache each page for a few minutes so that results stay stable while paging"
        why: "Each cached page is still computed at a different moment, so pages can still overlap. Uncached deep offsets stay slow."
      - id: c
        text: "Raise the maximum `limit` to 1,000 so clients need ten times fewer requests"
        why: "Fewer pages reduce how often duplicates appear but don't remove them. The database still scans and discards every row before the offset."
      - id: d
        text: "Sort by `id` ascending instead, so new rows land after the pages already read"
        why: "This avoids shifting pages, but it changes the product behaviour (oldest first) and doesn't fix the cost of large offsets."
    answer: [a]
    explanation: |
      `OFFSET n` makes the database produce and throw away n rows, so latency grows with depth.
      Inserts at the top of the ordering also shift every later page, which causes duplicates or
      skipped rows. Keyset (cursor) pagination remembers the sort key of the last item, with a
      unique tiebreaker such as `id`, and seeks directly to it through an index. Expose it as an
      opaque `next_cursor` token, as Stripe, GitHub and Slack APIs do.

  - id: swe-concurrency-001
    domain: swe
    topic: concurrency
    tags: [postgresql, transactions, race-conditions]
    level: 3
    kind: concept
    type: multi
    prompt: |
      ~~~python
      def reserve(conn, product_id):
          with conn.transaction():
              (stock,) = conn.execute(
                  "SELECT stock FROM products WHERE id = %s", (product_id,)
              ).fetchone()
              if stock > 0:
                  conn.execute(
                      "UPDATE products SET stock = %s WHERE id = %s",
                      (stock - 1, product_id),
                  )
      ~~~

      On PostgreSQL at the default isolation level, two requests run this concurrently while
      `stock = 1`. Both succeed and the item is oversold. Which changes prevent this?
      **Select all that apply.**
    choices:
      - id: a
        text: "Read the row with `SELECT ... FOR UPDATE`"
        why: "Correct. The second transaction waits for the row lock, then reads the committed stock of 0."
      - id: b
        text: "Use one statement, `UPDATE products SET stock = stock - 1 WHERE id = %s AND stock > 0`, and check the row count"
        why: "Correct. The check and the decrement happen atomically on the current row version, and the losing request sees 0 rows updated."
      - id: c
        text: "Add a `version` column, update `WHERE id = %s AND version = %s`, and retry when 0 rows change"
        why: "Correct. Optimistic locking detects that the row changed since it was read and makes the loser retry."
      - id: d
        text: "Nothing more is needed once both statements run inside one transaction"
        why: "They already do. Under `READ COMMITTED`, a transaction doesn't stop another from reading the same old value and writing a stale result."
      - id: e
        text: "Add an index on `products.id` so the two updates no longer collide"
        why: "An index speeds up the lookup (and `id` is likely already the primary key), but it has nothing to do with the race."
    answer: [a, b, c]
    explanation: |
      This is the classic lost update: read, compute in the application, write back. A
      transaction alone doesn't help at `READ COMMITTED`, PostgreSQL's default: both transactions
      read 1 and both write 0. The fixes are pessimistic locking (`FOR UPDATE`), pushing the logic
      into one atomic conditional `UPDATE`, optimistic concurrency with a version check, or
      `REPEATABLE READ`/`SERIALIZABLE` isolation plus retries on serialization failures. See the
      "Transaction Isolation" chapter of the PostgreSQL documentation.

  - id: swe-observability-001
    domain: swe
    topic: observability
    tags: [latency, microservices, monitoring]
    level: 3
    kind: concept
    type: single
    prompt: |
      After a release, p99 latency of the checkout endpoint jumped from 300 ms to 2 s, while the
      median barely moved. A checkout request passes through gateway → checkout → pricing →
      inventory → payment. CPU and error rates look normal everywhere. Which signal is the most
      direct way to find where slow requests spend their time?
    choices:
      - id: a
        text: "Distributed traces, whose spans show how long each hop took within one slow request"
        why: "Correct. A trace links the timed spans of one request across services, so you can open slow traces and see which hop grew."
      - id: b
        text: "Per-service average latency metrics, compared before and after the release"
        why: "Averages hide tail behaviour, which matters here since the median barely moved. Per-service numbers also don't show which call path the slow requests took."
      - id: c
        text: "Error-rate metrics per service, since slow calls usually end in errors"
        why: "Error rates are explicitly normal. Slow calls that eventually succeed never show up there."
      - id: d
        text: "Centralized logs from every service, searched for the word `timeout`"
        why: "Requests taking 2 s may never hit a timeout. Without a shared trace id, log lines are also hard to stitch into one request."
    answer: [a]
    explanation: |
      Metrics tell you that something is wrong, logs give details of individual events, and
      traces show where time goes along one request's path. For tail-latency problems in a
      multi-service call chain, traces are the direct tool. Instrument with OpenTelemetry and
      prefer tail-based sampling so slow requests are kept. Exemplars can link a latency
      histogram bucket straight to example traces.

  - id: stack-pandas-002
    domain: stack
    topic: pandas
    tags: [merge, joins, data-quality]
    level: 3
    kind: practical
    type: single
    prompt: |
      ~~~python
      import pandas as pd

      orders = pd.DataFrame({
          "order_id": [1, 2, 3],
          "customer_id": [10, 10, 20],
          "amount": [50, 30, 20],
      })
      customers = pd.DataFrame({
          "customer_id": [10, 10, 20],
          "segment": ["retail", "vip", "retail"],
      })

      df = orders.merge(customers, on="customer_id", how="left")
      print(len(df), df["amount"].sum())
      ~~~

      What does this print?
    choices:
      - id: a
        text: "`5 180`"
        why: "Correct. Customer 10 matches two rows, so orders 1 and 2 are each duplicated: 2 + 2 + 1 = 5 rows, and 50·2 + 30·2 + 20 = 180."
      - id: b
        text: "`3 100`"
        why: "A left join keeps every left row but can also multiply it: each order gets one output row per matching right row."
      - id: c
        text: "`5 100`"
        why: "The rows are duplicated together with their `amount` values, so the total is inflated as well."
      - id: d
        text: "A `MergeError` about duplicate keys in `customers`"
        why: "pandas checks key uniqueness only when you pass `validate=`, for example `validate='many_to_one'`."
    answer: [a]
    explanation: |
      Joins produce one row per matching pair. A duplicated key on the side you expected to be a
      lookup table silently multiplies rows and inflates sums, even with `how="left"`. Guard
      merges with `validate="many_to_one"` (or `"one_to_one"`), which raises a `MergeError` when
      the assumption fails, and compare row counts before and after the join. The same check
      applies to SQL joins against dimension tables.
